# ============================================================
# 监控仪表盘配置（扩展点 4 · 模型监控）
# 说明：本文件用于覆盖 app/components/monitor_utils.py 里的默认值；
#       不需要的项可以删除，删除后自动回退到代码中的默认值。
# ============================================================

# ===== 漂移检测 =====
drift:
  threshold: 0.1          # KS/PSI 漂移阈值，超过即判定为漂移
  missing_threshold: 0.1  # 缺失率变化阈值
  top_n: 15               # 漂移榜单展示的 Top N

# ===== 告警阈值 =====
alert:
  bad_rate: 0.25           # 违约率告警阈值（25%）
  avg_interest_rate: 20.0  # 平均利率告警阈值（20%）
  drifted_features: 5      # 漂移特征数告警阈值

# ===== 展示维度（列名 -> 中文标签，可自由扩展）=====
dimensions:
  grade: 贷款等级
  purpose: 贷款用途
  homeOwnership: 房屋所有权
  verificationStatus: 验证状态

# ===== 实时模拟流 =====
live_window: 60   # 窗口长度（分钟）
live_seed: 42     # 随机种子，保证可复现
