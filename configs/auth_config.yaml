# ============================================================
# 用户认证与权限配置
# 说明：账号数据库、密码策略、默认管理员、角色权限矩阵
# ============================================================

# ===== 数据库 =====
database:
  # SQLite 数据库文件路径（首次启动自动建库建表）
  path: "./data/auth/app.db"

# ===== 密码策略 =====
password_policy:
  min_length: 6          # 最短密码长度
  max_length: 64         # 最长密码长度

# ===== 密码哈希 =====
hash:
  algorithm: "pbkdf2_sha256"   # 标准库实现，无需额外依赖
  iterations: 100000           # PBKDF2 迭代次数
  salt_length: 16              # 盐字节数

# ===== 默认管理员 =====
# 首次启动时若用户表为空，自动创建该账号；之后修改此处不会影响已存在的账号
default_admin:
  username: "admin"
  password: "admin123"
  role: "admin"

# ===== 角色权限矩阵 =====
# 定义各角色可访问的页面（与 app/pages/ 页面文件对应）
# admin: 全部页面；user: 面向业务用户的预测/解释/助手页面
roles:
  admin:
    description: "管理员：全功能访问，含模型训练与系统管理"
    pages:
      - "数据探索"
      - "特征工程"
      - "模型训练"
      - "单笔预测"
      - "模型解释"
      - "LLM智能助手"
      - "系统配置"
      - "模型监控"
      - "A_B测试"
      - "用户管理"
  user:
    description: "普通用户：使用最优模型进行贷款风险评估"
    pages:
      - "单笔预测"
      - "模型解释"
      - "LLM智能助手"

# ===== 预测日志 =====
prediction_log:
  enabled: true          # 是否记录用户预测行为（供管理员审计）
  keep_recent: 50        # 用户管理页展示的最近日志条数
