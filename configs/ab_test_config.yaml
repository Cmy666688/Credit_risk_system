# ============================================================
# A/B 测试配置（扩展点 5 · A/B 测试框架）
# 说明：本文件用于覆盖 app/components/ab_test_utils.py 里的默认值；
#       不需要的项可以删除，删除后自动回退到代码中的默认值。
# ============================================================

# ===== 分流 =====
ratio: 0.5             # 分流到 A 组的比例（0~1）
bucket_count: 10000    # 哈希分桶数量，决定 ratio 的精度（10000 -> 0.01%）

# ===== 统计 =====
alpha: 0.05            # 两比例 z 检验的显著性水平

# ===== 离线实验 =====
sample_size: 5000      # 参与离线对比的样本量（受可用数据量上限约束）
group_a_model: xgboost   # A 组（对照组）模型
group_b_model: lightgbm  # B 组（实验组）模型
data_source: auto      # 数据来源：auto（真实优先，回退合成）/ real / sample
